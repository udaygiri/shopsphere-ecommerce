# ==============================================================================
# Render Blueprint Specification — ShopSphere Backend
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================
services:
  - type: web
    name: shopsphere-backend
    runtime: python
    plan: free
    region: oregon # (oregon, frankfurt, or singapore)
    branch: main
    rootDir: backend
    buildCommand: "pip install uv && uv sync --frozen --no-dev"
    startCommand: "uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite:///./ecommerce.db
      - key: SECRET_KEY
        generateValue: true # Render automatically generates a cryptographically secure 256-bit secret!
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: RAZORPAY_KEY_ID
        sync: false # Render dashboard prompts for your test Razorpay key
      - key: RAZORPAY_KEY_SECRET
        sync: false # Render dashboard prompts for your Razorpay secret
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false # Set to your Vercel deployment URL (e.g. https://shopsphere.vercel.app)
